name: sharding-repl-cache

services:
  configsrv:
    container_name: sharding-repl-cache-configsrv
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --port
      - "27017"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - configsrv_data:/data/db

  shard1-1:
    container_name: sharding-repl-cache-shard1-1
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1_1_data:/data/db
  shard1-2:
    container_name: sharding-repl-cache-shard1-2
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1_2_data:/data/db
  shard1-3:
    container_name: sharding-repl-cache-shard1-3
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard1ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard1_3_data:/data/db

  shard2-1:
    container_name: sharding-repl-cache-shard2-1
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2_1_data:/data/db
  shard2-2:
    container_name: sharding-repl-cache-shard2-2
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2_2_data:/data/db
  shard2-3:
    container_name: sharding-repl-cache-shard2-3
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongod", "--shardsvr", "--replSet", "shard2ReplSet", "--port", "27017", "--bind_ip_all", "--oplogSize", "128", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - shard2_3_data:/data/db

  mongos:
    container_name: sharding-repl-cache-mongos
    image: dh-mirror.gitverse.ru/mongo:7.0.43-jammy
    command: ["mongos", "--configdb", "configReplSet/configsrv:27017", "--port", "27017", "--bind_ip_all"]
    depends_on:
      - configsrv
      - shard1-1
      - shard1-2
      - shard1-3
      - shard2-1
      - shard2-2
      - shard2-3

  redis:
    container_name: sharding-repl-cache-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  pymongo-api:
    container_name: sharding-repl-cache-pymongo-api
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos
      - redis
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: mongodb://mongos:27017
      MONGODB_DATABASE_NAME: somedb
      REDIS_URL: redis://redis:6379

volumes:
  configsrv_data:
  shard1_1_data:
  shard1_2_data:
  shard1_3_data:
  shard2_1_data:
  shard2_2_data:
  shard2_3_data:
  redis_data:
