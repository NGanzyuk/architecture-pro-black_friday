name: mongo-sharding

services:
  configsrv:
    container_name: mongo-sharding-configsrv
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - mongod
      - --configsvr
      - --replSet
      - configReplSet
      - --port
      - "27017"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - configsrv_data:/data/db

  shard1:
    container_name: mongo-sharding-shard1
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard1ReplSet
      - --port
      - "27017"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - shard1_data:/data/db

  shard2:
    container_name: mongo-sharding-shard2
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - mongod
      - --shardsvr
      - --replSet
      - shard2ReplSet
      - --port
      - "27017"
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
    volumes:
      - shard2_data:/data/db

  mongos:
    container_name: mongo-sharding-mongos
    image: dh-mirror.gitverse.ru/mongo:latest
    command:
      - mongos
      - --configdb
      - configReplSet/configsrv:27017
      - --port
      - "27017"
      - --bind_ip_all
    depends_on:
      - configsrv
      - shard1
      - shard2

  pymongo-api:
    container_name: mongo-sharding-pymongo-api
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongos
    ports:
      - "8080:8080"
    environment:
      MONGODB_URL: mongodb://mongos:27017
      MONGODB_DATABASE_NAME: somedb

volumes:
  configsrv_data:
  shard1_data:
  shard2_data:
